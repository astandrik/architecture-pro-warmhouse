<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Smart Home Dashboard</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #8884; background: #eee2; cursor: pointer; }
    button:hover { background: #eee5; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #8883; text-align: left; }
    th { font-weight: 600; }
    .muted { opacity: 0.7; font-size: 12px; }
    .status { font-weight: 600; }
    .ok { color: #2e7d32; }
    .off { color: #b71c1c; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>Smart Home Dashboard</h1>
    <div class="toolbar">
      <button id="refreshBtn">Refresh</button>
      <span class="muted" id="updatedAt"></span>
    </div>
  </header>

  <section id="add">
    <h2 style="font-size:16px;margin:0 0 8px 0;">Add Sensor</h2>
    <form id="addForm" class="toolbar" style="flex-wrap:wrap;gap:8px;margin-bottom:16px;">
      <input type="text" id="fName" placeholder="Name" required style="padding:6px 8px;"/>
      <select id="fType" required style="padding:6px 8px;">
        <option value="temperature">temperature</option>
      </select>
      <input type="text" id="fLocation" placeholder="Location (e.g., Living Room)" required style="padding:6px 8px;"/>
      <input type="text" id="fUnit" placeholder="Unit (e.g., °C)" value="°C" style="padding:6px 8px;"/>
      <button type="submit">Add</button>
    </form>
    <div id="addMsg" class="muted"></div>
  </section>

  <section>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Location</th>
        <th>Value</th>
        <th>Unit</th>
        <th>Status</th>
        <th>Updated</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody id="rows">
      <tr><td colspan="9" class="muted">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <script>
    const rows = document.getElementById('rows');
    const updatedAt = document.getElementById('updatedAt');
    const refreshBtn = document.getElementById('refreshBtn');
    const addForm = document.getElementById('addForm');
    const addMsg = document.getElementById('addMsg');

    async function fetchSensors() {
      try {
        const res = await fetch('/api/v1/sensors', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        rows.innerHTML = '';
        for (const s of data) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${s.id}</td>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.type)}</td>
            <td>${escapeHtml(s.location)}</td>
            <td>${typeof s.value === 'number' ? s.value.toFixed(1) : ''}</td>
            <td>${escapeHtml(s.unit || '')}</td>
            <td class="status ${s.status === 'active' ? 'ok' : 'off'}">${escapeHtml(s.status)}</td>
            <td class="muted">${formatTime(s.last_updated)}</td>
            <td>
              <div class="toolbar">
                <button class="act" data-id="${s.id}">Activate</button>
                <button class="deact" data-id="${s.id}">Deactivate</button>
                <button class="del" data-id="${s.id}">Delete</button>
              </div>
            </td>
          `;
          // keep current numeric value on the row for status-only updates
          tr.dataset.value = (typeof s.value === 'number' ? String(s.value) : '0');
          rows.appendChild(tr);
        }
        updatedAt.textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        rows.innerHTML = `<tr><td colspan="9" class="muted">Failed to load: ${escapeHtml(String(e))}</td></tr>`;
      }
    }

    rows.addEventListener('click', async (ev) => {
      const target = ev.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.classList.contains('act') || target.classList.contains('deact')) {
        const id = target.getAttribute('data-id');
        if (!id) return;
        const row = target.closest('tr');
        const current = parseFloat((row && row.dataset && row.dataset.value) ? row.dataset.value : '0');
        const val = Number.isFinite(current) ? current : 0;
        const status = target.classList.contains('act') ? 'active' : 'inactive';
        try {
          const res = await fetch(`/api/v1/sensors/${id}/value`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: val, status })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          await fetchSensors();
        } catch (e) {
          alert('Failed to update status: ' + String(e));
        }
        return;
      }
      if (target.classList.contains('del')) {
        const id = target.getAttribute('data-id');
        if (!id) return;
        if (!confirm(`Delete sensor #${id}?`)) return;
        try {
          const res = await fetch(`/api/v1/sensors/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          await fetchSensors();
        } catch (e) {
          alert('Failed to delete: ' + String(e));
        }
        return;
      }
    });

    addForm.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      addMsg.textContent = '';
      const name = document.getElementById('fName').value.trim();
      const type = document.getElementById('fType').value;
      const location = document.getElementById('fLocation').value.trim();
      const unit = document.getElementById('fUnit').value.trim();
      if (!name || !type || !location) {
        addMsg.textContent = 'Fill name, type, location';
        return;
      }
      try {
        const res = await fetch('/api/v1/sensors', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, type, location, unit })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        document.getElementById('fName').value = '';
        document.getElementById('fLocation').value = '';
        await fetchSensors();
        addMsg.textContent = 'Added';
        setTimeout(() => addMsg.textContent = '', 1500);
      } catch (e) {
        addMsg.textContent = 'Failed to add: ' + String(e);
      }
    });

    function formatTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return ''; }
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    refreshBtn.addEventListener('click', fetchSensors);
    fetchSensors();
    setInterval(fetchSensors, 2000);
  </script>
</body>
</html>
