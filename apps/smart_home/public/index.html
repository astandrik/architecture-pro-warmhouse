<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Smart Home Dashboard</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0; }
    button { padding: 8px 12px; border-radius: 6px; border: 1px solid #8884; background: #eee2; cursor: pointer; }
    button:hover { background: #eee5; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #8883; text-align: left; }
    th { font-weight: 600; }
    .muted { opacity: 0.7; font-size: 12px; }
    .status { font-weight: 600; }
    .ok { color: #2e7d32; }
    .off { color: #b71c1c; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>Smart Home Dashboard</h1>
    <div class="toolbar">
      <button id="refreshBtn">Refresh</button>
      <span class="muted" id="updatedAt"></span>
    </div>
  </header>

  <section>
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Location</th>
        <th>Value</th>
        <th>Unit</th>
        <th>Status</th>
        <th>Updated</th>
      </tr>
      </thead>
      <tbody id="rows">
      <tr><td colspan="8" class="muted">Loading…</td></tr>
      </tbody>
    </table>
  </section>

  <script>
    const rows = document.getElementById('rows');
    const updatedAt = document.getElementById('updatedAt');
    const refreshBtn = document.getElementById('refreshBtn');

    async function fetchSensors() {
      try {
        const res = await fetch('/api/v1/sensors', { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        rows.innerHTML = '';
        for (const s of data) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${s.id}</td>
            <td>${escapeHtml(s.name)}</td>
            <td>${escapeHtml(s.type)}</td>
            <td>${escapeHtml(s.location)}</td>
            <td>${typeof s.value === 'number' ? s.value.toFixed(1) : ''}</td>
            <td>${escapeHtml(s.unit || '')}</td>
            <td class="status ${s.status === 'active' ? 'ok' : 'off'}">${escapeHtml(s.status)}</td>
            <td class="muted">${formatTime(s.last_updated)}</td>
          `;
          rows.appendChild(tr);
        }
        updatedAt.textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        rows.innerHTML = `<tr><td colspan="8" class="muted">Failed to load: ${escapeHtml(String(e))}</td></tr>`;
      }
    }

    function formatTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return ''; }
    }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    refreshBtn.addEventListener('click', fetchSensors);
    fetchSensors();
    setInterval(fetchSensors, 10000);
  </script>
</body>
</html>
