<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>API Docs</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #ddd; }
    .toolbar { display:flex; gap:8px; align-items:center; }
    select { padding:6px 8px; }
    main { height: calc(100vh - 52px); }
  </style>
</head>
<body>
  <header>
    <div>Smart Home — API Docs</div>
    <div class="toolbar">
      <label for="spec">Spec:</label>
      <select id="spec">
        <option value="/ui/schemas/SmartHomeOpenAPI.yaml">SmartHomeOpenAPI.yaml</option>
        <option value="/ui/schemas/DeviceRegistryOpenAPI.yaml">DeviceRegistryOpenAPI.yaml</option>
        <option value="/ui/schemas/UserHousesOpenAPI.yaml">UserHousesOpenAPI.yaml</option>
      </select>
      <a href="/ui/schemas/TelemetryAsyncAPI.yaml" target="_blank" rel="noreferrer">AsyncAPI (Telemetry)</a>
    </div>
  </header>
  <main id="swagger"></main>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    let ui;
    function load(url) {
      ui = SwaggerUIBundle({
        url,
        dom_id: '#swagger',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
      });
    }
    const select = document.getElementById('spec');
    select.addEventListener('change', () => load(select.value));
    load(select.value);
  </script>
</body>
</html>
