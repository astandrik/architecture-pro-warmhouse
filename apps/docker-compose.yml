version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
    image: smart-home/temperature-api:latest
    container_name: temperature-api
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  telemetry:
    build:
      context: ./telemetry-svc
    image: smart-home/telemetry-svc:latest
    container_name: telemetry-svc
    ports:
      - "8091:8091"
    restart: unless-stopped
    networks:
      - smarthome-network

  device-mgmt:
    build:
      context: ./device-mgmt-svc
    image: smart-home/device-mgmt-svc:latest
    container_name: device-mgmt-svc
    ports:
      - "8092:8092"
    restart: unless-stopped
    networks:
      - smarthome-network
    environment:
      - DEVICE_REGISTRY_URL=http://device-registry:8093

  device-registry:
    build:
      context: ./device-registry-svc
    image: smart-home/device-registry-svc:latest
    container_name: device-registry-svc
    ports:
      - "8093:8093"
    restart: unless-stopped
    networks:
      - smarthome-network
    environment:
      - USER_HOUSES_URL=http://user-houses:8094
      - DEVICE_REGISTRY_DB_URL=postgres://postgres:postgres@postgres:5432/device_registry
    depends_on:
      postgres:
        condition: service_healthy

  user-houses:
    build:
      context: ./user-houses-svc
    image: smart-home/user-houses-svc:latest
    container_name: user-houses-svc
    ports:
      - "8094:8094"
    restart: unless-stopped
    networks:
      - smarthome-network
    environment:
      - USER_HOUSES_DB_URL=postgres://postgres:postgres@postgres:5432/user_houses
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      telemetry:
        condition: service_started
      device-mgmt:
        condition: service_started
      device-registry:
        condition: service_started
      user-houses:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - TELEMETRY_URL=http://telemetry:8091
      - DEVICE_MGMT_URL=http://device-mgmt:8092
      - USER_HOUSES_URL=http://user-houses:8094
      - DEVICE_REGISTRY_URL=http://device-registry:8093
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge